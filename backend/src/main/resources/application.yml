server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: estoque-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque}
    username: ${DB_USER:estoque}
    password: ${DB_PASSWORD:estoque}
  jpa:
    hibernate:
      # Em produção prefira Flyway/Liquibase com "validate".
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  web:
    locale: pt_BR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false   # a documentação é exibida pelo Scalar em /scalar

app:
  cors:
    # Várias origens separadas por vírgula. O front em dev usa proxy, então isto só vale para chamadas diretas.
    allowed-origins: ${CORS_ORIGENS:http://localhost:4200}
  seed:
    # Popula o banco com dados de exemplo quando ele está vazio.
    enabled: ${SEED_ENABLED:true}
