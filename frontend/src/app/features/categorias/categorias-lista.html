<section class="pagina">
  <header class="pagina-cabecalho">
    <div>
      <h1>Categorias</h1>
      <p>Organize os produtos por grupo</p>
    </div>
    <button mat-flat-button type="button" (click)="nova()">
      <mat-icon>add</mat-icon>
      Nova categoria
    </button>
  </header>

  <div class="filtros">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Buscar por nome</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="search" [formControl]="busca" autocomplete="off" />
      @if (busca.value) {
        <button mat-icon-button matSuffix type="button" aria-label="Limpar busca" (click)="limparBusca()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  </div>

  <div class="tabela-container">
    @if (carregando()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <table
      mat-table
      matSort
      matSortActive="nome"
      matSortDirection="asc"
      matSortDisableClear
      [dataSource]="categorias()"
      (matSortChange)="ordenar($event)"
    >
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let c">{{ c.descricao || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="acoes">Ações</th>
        <td mat-cell *matCellDef="let c" class="acoes">
          <button mat-icon-button type="button" matTooltip="Editar" aria-label="Editar categoria" (click)="editar(c)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" matTooltip="Excluir" aria-label="Excluir categoria" (click)="excluir(c)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
    </table>

    @if (!carregando() && categorias().length === 0) {
      <div class="sem-resultados">
        <mat-icon>category</mat-icon>
        <p>Nenhuma categoria encontrada.</p>
      </div>
    }

    <mat-paginator
      [length]="total()"
      [pageSize]="tamanho()"
      [pageIndex]="pagina()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="mudarPagina($event)"
    />
  </div>
</section>
